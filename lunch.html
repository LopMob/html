<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Собрать ланч</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lunch.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
<header>
  <h1>Собрать ланч</h1>
  <nav>
    <a href="index.html">Главная</a>
    <a href="menu.html">Меню</a>
    <a href="lunch.html" class="active">Собрать ланч</a>
    <a href="contacts.html">Контакты</a>
    <a href="auth.html">Войти</a>
  </nav>
</header>

<main>
  <!-- Супы -->
  <section id="soups">
    <h2>Супы</h2>
    <div class="dishes"></div>
  </section>

  <!-- Главные блюда -->
  <section id="mains">
    <h2>Главные блюда</h2>
    <div class="dishes"></div>
  </section>

  <!-- Напитки -->
  <section id="drinks">
    <h2>Напитки</h2>
    <div class="dishes"></div>
  </section>

  <!-- Заказ -->
  <section id="order-block">
    <h2>Сделать заказ</h2>
    <form id="order-form" action="https://httpbin.org/post" method="POST" target="_blank">
      <div class="order-container">
        <!-- Левая колонка: выбранные блюда -->
        <div class="order-left" id="order">
          <p>Ничего не выбрано</p>
        </div>

        <!-- Правая колонка: данные клиента -->
        <div class="order-right">
          <h3>Ваши данные</h3>
          <label>Имя:<br><input type="text" name="customerName" required></label><br>
          <label>Email:<br><input type="email" name="email" required></label><br>
          <label><input type="checkbox" name="subscribe" value="yes"> Получать информацию о скидках и акциях</label><br>
          <label>Номер телефона:<br><input type="tel" name="phone" required></label><br>
          <label>Адрес доставки:<br><input type="text" name="address"></label><br>
          <p><em>Доставка осуществляется только по Москве</em></p>
          <p>Время доставки:</p>
          <label><input type="radio" name="deliveryTime" value="soon" checked> Как можно скорее</label><br>
          <label><input type="radio" name="deliveryTime" value="scheduled"> К указанному времени</label><br>
          <label>Комментарии к заказу:<br><textarea name="comment"></textarea></label>
        </div>
      </div>
      <button type="submit">Отправить заказ</button>
    </form>
  </section>
</main>

<footer>
  <p>Контакты: <a href="tel:+74951234567">+7 (495) 123-45-67</a> | 
  <a href="mailto:info@businesslunch.ru">info@businesslunch.ru</a></p>
  <p>Адрес: Москва, ул. Примерная, 10</p>
</footer>

<script src="dishes.js"></script>
<script src="render.js"></script>
<script src="order.js"></script>
</body>
</html>
