<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформить заказ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Оформление заказа</h1>
    <nav>
      <a href="index.html">Главная</a>
    <a href="menu.html">Меню</a>
    <a href="lunch.html">Собрать ланч</a>
    <a href="checkout.html">Оформить заказ</a>
    <a href="orders.html">Заказы</a>
    <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <main class="checkout-container">
  <section id="order-summary">
    <h2>Состав заказа</h2>
    <div id="selected-dishes"></div>
    <p id="total-price">Итого: 0 ₽</p>
  </section>

  <section id="checkout-form-block">
  <h3>Ваши данные</h3>
  <form id="checkout-form">
    <label for="name">Имя</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label>
      <input type="checkbox" name="promo" checked>
      Получать информацию о скидках и акциях
    </label>

    <label for="phone">Номер телефона</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="address">Адрес доставки</label>
    <input type="text" id="address" name="address" required>
    <small>Доставка осуществляется только по Москве</small>

    <label>Время доставки:</label>
    <div class="radio-group">
      <label><input type="radio" name="delivery_type" value="now" checked> Как можно скорее</label>
      <label><input type="radio" name="delivery_type" value="time"> К указанному времени</label>
    </div>

    <label for="delivery-time">Укажите время доставки</label>
    <input type="time" id="delivery-time" name="delivery_time" min="07:00" max="23:00">
    <small>Доступное время доставки с 7:00 до 23:00</small>

    <div style="display: flex; gap: 10px;">
      <button type="reset">Сбросить</button>
      <button type="submit">Отправить</button>
    </div>
  </form>
</section>
</main>


  <footer>
    <p>Контакты: +7 (495) 123-45-67 | info@businesslunch.ru</p>
  </footer>

  <script src="checkout.js"></script>
</body>
</html>
